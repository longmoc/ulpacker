name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # An allow-list, not an ignore-list. `paths-ignore: [ios/**]` only skips a
    # commit when *every* changed file matches, so an iOS commit that also
    # touched .gitignore or tools/ still rebuilt and redeployed the site —
    # which is exactly what happened. Naming what the web build actually
    # depends on means a new directory never triggers a deploy by accident.
    #
    # fixtures/ is here on purpose: it is not shipped, but `npm test` asserts
    # against it and this workflow is the only CI the repo has.
    paths:
      - 'src/**'
      - 'public/**'
      - 'fixtures/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
